name: Deploy Phase 1A prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # NOTE: this workflow intentionally does NOT run `npm ci` / `npm run build`.
      # @walmart/ld-kit is a private package resolved only via Walmart's internal
      # Artifactory registry/proxy (see mmc-phase1a-prototype/.npmrc) — a public
      # GitHub Actions runner has no route to it and `npm ci` fails outright
      # (exit code 1). Instead, the build output is produced locally with
      # `npm run build:pages` and committed to mmc-phase1a-prototype/dist,
      # and this job just publishes that committed artifact as-is.
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mmc-phase1a-prototype/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
